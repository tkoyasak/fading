[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.93.0" # https://github.com/actions/runner-images

[workspace.dependencies]
# local crates
fading-ls = { path = "crates/ls" }

# non-local crates
anyhow = { version = "1.0.102" }
aes-gcm = { version = "0.10.3" }
base16ct = { version = "1.0.0", features = ["alloc"] }
crop = { version = "0.4.3" }
env_logger = { version = "0.11.10" }
jiff = { version = "0.2.24" }
mac-notification-sys = { version = "0.6.12" }
nojson = { version = "0.3.12" }
log = { version = "0.4.29" }
papaya = { version = "0.2.4" }
proptest = { version = "1.11.0" }
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
shiguredo_s3 = { version = "2026.1.0-canary.3" }
ureq = { version = "3.3.0" }
serial_test = { version = "3.4.0" }
tokio = { version = "1.52.3", features = ["io-std", "macros", "rt", "rt-multi-thread"] }
toml = { version = "1.1.2" }
tower = { version = "0.5.3" }
tower-lsp-server = { version = "0.23.0" }
tree-sitter = { version = "0.26.9" }
tree-sitter-md = { version = "0.5.3", features = ["parser"] }
xflags = { version = "0.4.0-pre.2" }
xshell = { version = "0.3.0-pre.2" }
zed_extension_api = { version = "0.7.0" }
