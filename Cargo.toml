[workspace]
resolver = "3"
members = ["crates/*", "tasks/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.91.0" # https://github.com/actions/runner-images

[workspace.dependencies]
# local crates
fading-ls = { path = "crates/ls" }

# non-local crates
anyhow = { version = "1.0.100" }
base64 = { version = "0.22.1" }
chrono = { version = "0.4.42" }
env_logger = { version = "0.11.8" }
log = { version = "0.4.28" }
papaya = { version = "0.2.3" }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["io-std", "rt-multi-thread"] }
toml = { version = "0.9.8" }
tower-lsp-server = { version = "0.22.1" }
xflags = { version = "0.4.0-pre.2" }
xshell = { version = "0.3.0-pre.2" }
zed_extension_api = { version = "0.7.0" }
