[workspace]
resolver = "3"
members = [
  "crates/cli",
  "crates/ls",
  "crates/workflow",
  "crates/zed"
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89.0" # https://github.com/actions/runner-images

[workspace.dependencies]
anyhow = { version = "1.0.100" }
chrono = { version = "0.4.42" }
env_logger = { version = "0.11.8" }
log = { version = "0.4.28" }
octocrab = { version = "0.46.0" }
papaya = { version = "0.2.3" }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.47.1", features = ["io-std", "macros", "rt-multi-thread"] }
toml = { version = "0.9.7" }
tower-lsp-server = { version = "0.22.1" }
xflags = { version = "0.4.0-pre.2" }
zed_extension_api = { version = "0.7.0" }
